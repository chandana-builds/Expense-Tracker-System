# ===================================================================
# Expense Tracker System - Main Configuration
# ===================================================================
spring.application.name=Expense Tracker System
server.port=${PORT:8080}

# Default Profile: H2 (Zero-configuration out-of-the-box run)
# To switch to MySQL, change the active profile to 'mysql' or update properties below
spring.profiles.active=dev

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Formatting & Jackson
spring.mvc.format.date=yyyy-MM-dd
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata
