<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - SpendWise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary">
    <div class="glass-card p-5 text-center" style="max-width: 500px;">
        <div class="text-danger mb-3">
            <i class="bi bi-exclamation-octagon fs-1"></i>
        </div>
        <h2 class="fw-bold mb-2" th:text="${errorCode != null ? errorCode : '500'}">500</h2>
        <h5 class="fw-semibold mb-3">Something Went Wrong</h5>
        <p class="text-muted small mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested resource could not be found or an internal error occurred.'}">
            An unexpected error occurred.
        </p>
        <a th:href="@{/dashboard}" class="btn btn-primary-custom">
            <i class="bi bi-house-door me-1"></i> Back to Dashboard
        </a>
    </div>
</body>
</html>
