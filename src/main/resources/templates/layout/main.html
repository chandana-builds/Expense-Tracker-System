<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - Expense Tracker' : 'Expense Tracker System'}">Expense Tracker System</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Application CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="d-flex min-vh-100">
    <!-- Sidebar -->
    <aside class="app-sidebar p-3 d-flex flex-column flex-shrink-0 text-white">
        <div class="d-flex align-items-center gap-2 mb-4 px-2">
            <div class="bg-primary rounded-3 p-2 d-flex align-items-center justify-content-center text-white" style="width: 40px; height: 40px;">
                <i class="bi bi-wallet2 fs-5"></i>
            </div>
            <div>
                <span class="fs-5 fw-bold tracking-tight text-white d-block lh-1">SpendWise</span>
                <small class="text-secondary" style="font-size: 0.72rem;">Expense Tracker</small>
            </div>
        </div>

        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a th:href="@{/dashboard}" class="nav-link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                    <i class="bi bi-grid-1x2"></i> Dashboard
                </a>
            </li>
            <li>
                <a th:href="@{/expenses}" class="nav-link" th:classappend="${activePage == 'expenses' ? 'active' : ''}">
                    <i class="bi bi-arrow-left-right"></i> Transactions
                </a>
            </li>
            <li>
                <a th:href="@{/budgets}" class="nav-link" th:classappend="${activePage == 'budgets' ? 'active' : ''}">
                    <i class="bi bi-pie-chart"></i> Budgets & Goals
                </a>
            </li>
            <li>
                <a th:href="@{/categories}" class="nav-link" th:classappend="${activePage == 'categories' ? 'active' : ''}">
                    <i class="bi bi-tags"></i> Categories
                </a>
            </li>
        </ul>

        <hr class="border-secondary opacity-25">

        <!-- User Profile Badge & Quick Action -->
        <div class="p-2 bg-dark bg-opacity-50 rounded-3 mb-2">
            <div class="d-flex align-items-center gap-2">
                <div class="rounded-circle bg-primary bg-opacity-25 text-primary fw-bold d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
                    <i class="bi bi-person-fill fs-5"></i>
                </div>
                <div class="overflow-hidden">
                    <span class="d-block text-white fw-semibold text-truncate small" th:text="${user != null ? user.fullName : 'Alex Morgan'}">Alex Morgan</span>
                    <small class="text-secondary text-truncate d-block" style="font-size: 0.72rem;" th:text="${user != null ? '@' + user.username : '@demo'}">@demo</small>
                </div>
            </div>
        </div>

        <div class="d-grid gap-1">
            <button class="btn btn-primary-custom btn-sm mb-2" data-bs-toggle="modal" data-bs-target="#quickAddModal">
                <i class="bi bi-plus-lg me-1"></i> Add Transaction
            </button>
            <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i> Sign Out
            </a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <!-- Top Navigation Bar -->
        <header class="navbar navbar-expand border-bottom px-4 py-3 bg-body-tertiary">
            <div class="container-fluid p-0">
                <div class="d-flex align-items-center gap-3">
                    <h5 class="m-0 fw-bold" th:text="${headerTitle != null ? headerTitle : 'Financial Overview'}">Financial Overview</h5>
                </div>
                
                <div class="d-flex align-items-center gap-3">
                    <!-- Dark/Light Mode Switcher -->
                    <button class="btn btn-light rounded-circle p-2 border" id="themeToggleBtn" type="button" title="Switch Theme">
                        <i class="bi bi-moon-stars-fill"></i>
                    </button>
                    
                    <a th:href="@{/expenses/export}" class="btn btn-outline-secondary btn-sm" title="Export Transactions as CSV">
                        <i class="bi bi-download me-1"></i> Export CSV
                    </a>
                </div>
            </div>
        </header>

        <!-- Flash Messages -->
        <div class="px-4 pt-3" th:if="${successMessage != null}">
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>
        <div class="px-4 pt-3" th:if="${errorMessage != null}">
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

        <!-- Injected Body Content -->
        <main class="flex-grow-1 p-4">
            <div th:replace="${content}"></div>
        </main>

        <footer class="py-3 px-4 border-top text-center text-muted small bg-body-tertiary">
            <span>SpendWise Enterprise Expense Tracker System &copy; 2026. Built with Spring Boot, Hibernate, MySQL, Bootstrap & jQuery.</span>
        </footer>
    </div>
</div>

<!-- =============================================================== -->
<!-- QUICK ADD TRANSACTION MODAL                                      -->
<!-- =============================================================== -->
<div class="modal fade" id="quickAddModal" tabindex="-1" aria-labelledby="quickAddModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card">
            <form th:action="@{/expenses/add}" method="post">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="quickAddModalLabel">
                        <i class="bi bi-plus-circle text-primary me-2"></i>Record Transaction
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Type</label>
                        <select name="type" class="form-select" required>
                            <option value="EXPENSE">Expense (-)</option>
                            <option value="INCOME">Income (+)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Description / Title</label>
                        <input type="text" name="title" class="form-control" placeholder="e.g. Grocery shopping, Client payment" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Amount ($)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" required min="0.01">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Category</label>
                            <select name="categoryId" class="form-select" required>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Date</label>
                            <input type="date" name="transactionDate" class="form-control" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Payment Method</label>
                            <select name="paymentMethod" class="form-select">
                                <option value="CASH">Cash</option>
                                <option value="CREDIT_CARD">Credit Card</option>
                                <option value="DEBIT_CARD">Debit Card</option>
                                <option value="UPI">UPI / PhonePe / GPay</option>
                                <option value="NET_BANKING">Net Banking</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label small fw-semibold">Notes (Optional)</label>
                        <textarea name="notes" class="form-control" rows="2" placeholder="Add extra context or receipt tags..."></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom">Save Transaction</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- =============================================================== -->
<!-- SCRIPTS: jQuery, Bootstrap 5.3, Chart.js, Custom App JS          -->
<!-- =============================================================== -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script th:src="@{/js/app.js}"></script>

</body>
</html>
