<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SpendWise Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            width: 100%;
            max-width: 440px;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #6366f1;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.35);
        }
        .form-control::placeholder {
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container p-3">
    <div class="auth-card p-4 p-sm-5 mx-auto">
        <div class="text-center mb-4">
            <div class="bg-primary rounded-4 p-3 d-inline-flex align-items-center justify-content-center text-white mb-3" style="width: 54px; height: 54px;">
                <i class="bi bi-wallet2 fs-3"></i>
            </div>
            <h4 class="fw-bold tracking-tight mb-1">SpendWise</h4>
            <p class="text-secondary small mb-0">Full-Stack Expense Tracker System</p>
        </div>

        <div th:if="${error != null}" class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-circle-fill me-1"></i> <span th:text="${error}"></span>
        </div>

        <div th:if="${param.logout != null}" class="alert alert-info py-2 small" role="alert">
            <i class="bi bi-info-circle-fill me-1"></i> You have been safely logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small text-secondary fw-semibold">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-secondary" style="border-color: rgba(255, 255, 255, 0.15);"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" id="usernameInput" placeholder="Enter username or email" th:value="${username != null ? username : 'demo'}" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small text-secondary fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-secondary" style="border-color: rgba(255, 255, 255, 0.15);"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" id="passwordInput" placeholder="Enter password" value="password123" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                Sign In
            </button>
        </form>

        <!-- Quick Demo Autofill Hint -->
        <div class="p-3 rounded-3 mb-3 border" style="background: rgba(255, 255, 255, 0.03); border-color: rgba(255, 255, 255, 0.08) !important;">
            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <span class="d-block small fw-bold text-white"><i class="bi bi-stars text-warning me-1"></i> Instant Demo</span>
                    <small class="text-secondary" style="font-size: 0.75rem;">Username: <strong>demo</strong> / Pass: <strong>password123</strong></small>
                </div>
                <button type="button" class="btn btn-sm btn-outline-light py-1 px-2" style="font-size: 0.75rem;" onclick="$('#usernameInput').val('demo'); $('#passwordInput').val('password123');">Autofill</button>
            </div>
        </div>

        <div class="text-center small text-secondary">
            Don't have an account yet?
            <a th:href="@{/register}" class="text-primary text-decoration-none fw-semibold">Create an account</a>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
