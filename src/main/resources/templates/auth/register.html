<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SpendWise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            width: 100%;
            max-width: 460px;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #6366f1;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.35);
        }
        .form-control::placeholder {
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container p-3">
    <div class="auth-card p-4 p-sm-5 mx-auto">
        <div class="text-center mb-4">
            <div class="bg-primary rounded-4 p-3 d-inline-flex align-items-center justify-content-center text-white mb-3" style="width: 54px; height: 54px;">
                <i class="bi bi-wallet2 fs-3"></i>
            </div>
            <h4 class="fw-bold tracking-tight mb-1">Create Account</h4>
            <p class="text-secondary small mb-0">Join SpendWise Expense Tracker</p>
        </div>

        <div th:if="${errorMessage != null}" class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-circle-fill me-1"></i> <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/register}" th:object="${userDto}" method="post">
            <div class="mb-3">
                <label class="form-label small text-secondary fw-semibold">Full Name</label>
                <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. John Doe" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label small text-secondary fw-semibold">Username</label>
                <input type="text" th:field="*{username}" class="form-control" placeholder="e.g. johndoe" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label small text-secondary fw-semibold">Email Address</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="name@domain.com" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label small text-secondary fw-semibold">Password</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="Minimum 6 characters" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label small text-secondary fw-semibold">Confirm Password</label>
                <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Re-type password" required>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                Sign Up & Launch
            </button>
        </form>

        <div class="text-center small text-secondary">
            Already have an account?
            <a th:href="@{/login}" class="text-primary text-decoration-none fw-semibold">Sign in here</a>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
